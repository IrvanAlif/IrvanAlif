<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="50%" style="stop-color:#150d2e"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="16"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="white" fill-opacity="0.04"/>
  </pattern>
  <rect width="800" height="200" fill="url(#dots)" rx="16"/>

  <!-- Orb glows -->
  <ellipse cx="120" cy="60" rx="90" ry="70" fill="#7c3aed" fill-opacity="0.12" filter="url(#softglow)"/>
  <ellipse cx="680" cy="140" rx="80" ry="60" fill="#0ea5e9" fill-opacity="0.12" filter="url(#softglow)"/>
  <ellipse cx="400" cy="180" rx="120" ry="50" fill="#ec4899" fill-opacity="0.07" filter="url(#softglow)"/>

  <!-- Top border line -->
  <rect x="0" y="0" width="800" height="1" fill="url(#lineGrad)" rx="1"/>
  <!-- Bottom border line -->
  <rect x="0" y="199" width="800" height="1" fill="url(#lineGrad)" rx="1"/>

  <!-- Decorative circles -->
  <circle cx="60" cy="100" r="40" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="60" cy="100" r="55" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.15"/>
  <circle cx="740" cy="100" r="40" fill="none" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="740" cy="100" r="55" fill="none" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Corner accents -->
  <path d="M0,30 Q0,0 30,0" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M770,0 Q800,0 800,30" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M0,170 Q0,200 30,200" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M770,200 Q800,200 800,170" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Name -->
  <text x="400" y="88" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="42" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="-1">Irvan Alif</text>

  <!-- Divider -->
  <rect x="300" y="100" width="200" height="1" fill="url(#lineGrad)"/>

  <!-- Subtitle -->
  <text x="400" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8" letter-spacing="3">&lt; Developer / Builder /&gt;</text>

  <!-- Tags -->
  <rect x="258" y="148" width="72" height="22" rx="11" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="294" y="163" text-anchor="middle" font-family="Arial" font-size="11" fill="#c4b5fd" font-weight="500">Frontend</text>

  <rect x="340" y="148" width="60" height="22" rx="11" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="370" y="163" text-anchor="middle" font-family="Arial" font-size="11" fill="#7dd3fc" font-weight="500">Python</text>

  <rect x="410" y="148" width="52" height="22" rx="11" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="436" y="163" text-anchor="middle" font-family="Arial" font-size="11" fill="#f9a8d4" font-weight="500">Flutter</text>

  <!-- Floating dots -->
  <circle cx="200" cy="50" r="2" fill="#a78bfa" fill-opacity="0.6"/>
  <circle cx="220" cy="80" r="1.5" fill="#38bdf8" fill-opacity="0.4"/>
  <circle cx="580" cy="40" r="2" fill="#ec4899" fill-opacity="0.5"/>
  <circle cx="600" cy="70" r="1.5" fill="#a78bfa" fill-opacity="0.4"/>
  <circle cx="160" cy="150" r="1.5" fill="#38bdf8" fill-opacity="0.4"/>
  <circle cx="640" cy="160" r="2" fill="#a78bfa" fill-opacity="0.5"/>
</svg>
